name: Quality

# Per-PR and main gate: one pass of the canonical commands. The disposal/re-bootstrap journey,
# pnpm test:long-run and full Wave qualification run in qualification.yml (manual dispatch).
# Parallel jobs run shares of the canonical commands, each recording its receipts; test:runtime runs
# as shards (scripts/ci/runtime-shards.mjs). The required quality job merges every receipt into one
# evidence manifest, and fails unless every job passed.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commands:
    name: ${{ matrix.share }}
    # Set the QUALITY_RUNNER repository variable to use a larger runner without a code change.
    # Fork pull requests always get the standard runner: outsiders never spend the paid one.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.QUALITY_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each share installs first; only the checks share records the install receipt.
          - share: checks
            commands: install,check,verify-docs,infra-validate,supply-chain
          - share: tests
            commands: test
          - share: database
            commands: test-db,test-replay,db-verify
          - share: browser-build
            commands: ""
          # One job per test:runtime shard, 1 to runtimeShardCount (scripts/ci/runtime-shards.mjs);
          # without every shard's receipt the quality job counts test:runtime as missing and fails.
          - share: runtime-1
            commands: ""
            shard: 1
          - share: runtime-2
            commands: ""
            shard: 2
          - share: runtime-3
            commands: ""
            shard: 3
          - share: runtime-4
            commands: ""
            shard: 4
    steps:
      - name: Record runner facts
        env:
          RUNNER_LABEL: ${{ vars.QUALITY_RUNNER || 'ubuntu-26.04' }}
          RUNNER_NAME: ${{ runner.name }}
        run: printf 'runner=%s label=%s cpus=%s\n' "$RUNNER_NAME" "$RUNNER_LABEL" "$(nproc)"

      - name: Initialize runner-local evidence directory
        run: printf 'CI_EVIDENCE_DIR=%s/quality-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out candidate with Git LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      # A pull request's checkout is its merge into current main, and a merge queue's is its commit on
      # the queue's base; either way the first parent is that base;
      # the event's base.sha can be older, and main's later changes would count as the PR's.
      - name: Record the contract base commit
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$GITHUB_EVENT_NAME" != push ]; then base="$(git rev-parse --verify HEAD^1)"; fi
          printf 'CONTRACT_BASE_COMMIT=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Set up pinned toolchain
        uses: ./.github/actions/toolchain

      - name: Install the locked dependencies
        if: ${{ !contains(matrix.commands, 'install') }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bootstrap canonical local capability (${{ matrix.share }})
        if: ${{ matrix.commands != '' }}
        run: node scripts/bootstrap.mjs "$CI_EVIDENCE_DIR" --only "${{ matrix.commands }}"

      - name: Run test:runtime shard ${{ matrix.shard }}
        if: ${{ matrix.shard }}
        run: node scripts/bootstrap.mjs "$CI_EVIDENCE_DIR" --runtime-shard "${{ matrix.shard }}"

      - name: Install pinned real browser
        if: ${{ matrix.share == 'browser-build' }}
        run: scripts/ci/toolchain.sh browser

      - name: Browser smoke and accessibility journey
        if: ${{ matrix.share == 'browser-build' }}
        run: node scripts/ci/evidence.mjs run "$CI_EVIDENCE_DIR" browser node node_modules/vitest/vitest.mjs run --config tests/ci/vitest.browser.config.ts

      - name: Build immutable candidate artifacts
        if: ${{ always() && !cancelled() && matrix.share == 'browser-build' }}
        run: node scripts/ci/evidence.mjs run "$CI_EVIDENCE_DIR" build node scripts/ci/build.mjs "$CI_EVIDENCE_DIR/build"

      - name: Retain this share's receipts for the quality job
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-receipts-${{ matrix.share }}
          path: ${{ runner.temp }}/quality-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  quality:
    needs: commands
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.QUALITY_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 45
    steps:
      - name: Record runner facts
        env:
          RUNNER_LABEL: ${{ vars.QUALITY_RUNNER || 'ubuntu-26.04' }}
          RUNNER_NAME: ${{ runner.name }}
        run: printf 'runner=%s label=%s cpus=%s\n' "$RUNNER_NAME" "$RUNNER_LABEL" "$(nproc)"

      - name: Initialize runner-local evidence directory
        run: printf 'CI_EVIDENCE_DIR=%s/quality-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out candidate with Git LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Record the contract base commit
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$GITHUB_EVENT_NAME" != push ]; then base="$(git rev-parse --verify HEAD^1)"; fi
          printf 'CONTRACT_BASE_COMMIT=%s\n' "$base" >> "$GITHUB_ENV"

      # Main pushes qualify recovery and reproduction, which need the full toolchain.
      - name: Set up pinned toolchain
        if: ${{ github.event_name == 'push' }}
        uses: ./.github/actions/toolchain

      - name: Set up repository Node.js
        if: ${{ github.event_name != 'push' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install the locked dependencies
        run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts

      - name: Collect every share's receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: quality-receipts-*
          merge-multiple: true
          path: ${{ runner.temp }}/quality-evidence

      # Main pushes produce deployable candidates, so they also qualify recovery and reproduction.
      - name: Qualify local recovery and independent builds
        if: ${{ github.event_name == 'push' && needs.commands.result == 'success' }}
        run: node scripts/ci/evidence.mjs run "$CI_EVIDENCE_DIR" qualify-wave0 pnpm run qualify:wave0

      - name: Generate evidence from actual CI results
        id: evidence
        if: ${{ always() && !cancelled() }}
        run: node scripts/ci/evidence.mjs generate "$CI_EVIDENCE_DIR" "$CI_EVIDENCE_DIR/build"

      - name: Retain candidate evidence and useful failure artifacts
        if: ${{ always() && !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence
          path: ${{ runner.temp }}/quality-evidence
          if-no-files-found: error
          retention-days: 30

      # A canonical command no share recorded, or a test:runtime shard that did not run, stays in
      # the manifest's missingCommands.
      - name: Require every share to pass
        env:
          RESULT: ${{ needs.commands.result }}
        run: |
          test "$RESULT" = success
          jq -e '.extensions.missingCommands == []' "$CI_EVIDENCE_DIR/evidence-manifest.json"
