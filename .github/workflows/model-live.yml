name: Model live check

# Manual real-provider check (decision 2026-11-07 on #19): proves the production model route answers
# with the real Anthropic and AI Gateway keys. Dispatch only; never a pull-request or scheduled check,
# so CI never spends on a provider by default. The keys are organisation secrets selected for this
# repository and reach only the one test step.
on:
  workflow_dispatch:

concurrency:
  group: model-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install the locked dependencies
        run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts

      - name: Run the gateway's live check
        env:
          CLOCKGROVE_MODEL_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: pnpm --filter @clockgrove/model-gateway test:live
